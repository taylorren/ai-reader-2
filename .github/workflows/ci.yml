# The suite, the browser tests and the container — on every push and PR.
#
# Three things this file exists to prevent, all of them observed here:
#   * a browser test that skips in CI. `tests/test_browser.py` skips cleanly
#     when Chromium is absent, which is right on a developer's laptop and wrong
#     on a runner: 22 tests would report green without running. The workflow
#     installs Chromium and sets CI_REQUIRE_BROWSER=1, which turns that skip
#     into a failure.
#   * an upload path that only works on a host. The container's `/app/temp` and
#     `/app/books` are different filesystems when books is a bind mount, which
#     is the deployment shape that produced PITFALLS 2. The docker job mounts
#     the library and uploads a fixture through it, rather than just loading `/`.
#   * a broken image. The docker job builds the Dockerfile it ships.
#
# 3.12 is the image's interpreter, and the runner's own `python3` is newer
# (3.14 on the current images), so UV_PYTHON pins the suite to the version the
# container ships instead of whatever uv finds first. `requires-python` is
# >=3.10, so a matrix (`python-version: ["3.10", "3.12"]`) would also pin the
# floor; it doubles the browser suite's time, so it is left as a deliberate
# choice.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python, Node and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # A missing browser is a failed run here, never a silent skip.
      CI_REQUIRE_BROWSER: "1"
      # The interpreter the image ships, not the runner's default.
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the locked environment
        run: uv sync --frozen --group dev

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Chromium (and the libraries it needs)
        run: uv run playwright install --with-deps chromium

      # pytest runs the Node units too (tests/test_frontend.py), so a separate
      # `node --test` step would only duplicate the same 69 tests.
      - name: Run the suite
        run: uv run pytest -q -rs

  docker:
    name: Docker image, with a bind-mounted library
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Everything writable lives in the runner's temp directory, not in the
      # checkout: the fixture, the two mounts and the database the container
      # creates. `/app/temp` is then a different filesystem from `/app/books`,
      # which is the deployment shape that found PITFALLS 2.
      - name: Build a fixture EPUB and the mount points
        run: |
          mkdir -p "$RUNNER_TEMP/books" "$RUNNER_TEMP/data"
          python3 -c "import sys; sys.path.insert(0, 'tests'); from fixtures import write_epub; write_epub('$RUNNER_TEMP/fixture.epub')"

      # The image runs as uid 1000 (the NAS account); the runner's files belong
      # to another uid, so a bind mount it writes through must be handed over.
      - name: Give the reader's uid the mounts
        run: sudo chown -R 1000:1000 "$RUNNER_TEMP/books" "$RUNNER_TEMP/data"

      - name: Build the image
        run: docker build -t ai-reader-ci .

      - name: Run it over the bind mount
        run: |
          docker run -d --name reader-ci \
            -p 127.0.0.1:8123:8123 \
            -v "$RUNNER_TEMP/books:/app/books" \
            -v "$RUNNER_TEMP/data:/data" \
            ai-reader-ci

      - name: Wait for the reader
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 2 -o /dev/null http://127.0.0.1:8123/; then
              exit 0
            fi
            sleep 1
          done
          echo "the reader did not answer in 60 seconds"
          docker logs reader-ci
          exit 1

      # The upload is the step that failed on the 2.0.0 image (cross-device
      # link between /app/temp and the books mount), so it must be exercised,
      # not assumed: the file has to land in the mounted directory.
      - name: Upload a book through the bind mount
        run: |
          curl -fsS --max-time 60 \
            -F "file=@$RUNNER_TEMP/fixture.epub;type=application/epub+zip" \
            http://127.0.0.1:8123/upload | tee "$RUNNER_TEMP/upload.json"
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"success"' "$RUNNER_TEMP/upload.json"
          test -f "$RUNNER_TEMP/books/Fixture Book/Fixture Book.epub"
          test -z "$(find "$RUNNER_TEMP/books" -name '*.part' -print -quit)"
          curl -fsS --max-time 10 http://127.0.0.1:8123/ | grep -q "Fixture Book"

      - name: The container's log, on failure
        if: failure()
        run: docker logs reader-ci

      - name: Stop it
        if: always()
        run: docker rm -f reader-ci
