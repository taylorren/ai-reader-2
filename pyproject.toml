[project]
name = "ai-reader-2"
version = "0.1.0"
description = "Self-hosted EPUB reader with AI-assisted annotation, built on epubx"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "epub-extended>=0.1.0",
    "fastapi>=0.121.2",
    "uvicorn>=0.38.0",
    "jinja2>=3.1.6",
    "httpx>=0.27.0",
    "python-multipart>=0.0.6",
    "pypinyin>=0.54.0",
    "markdown-it-py",
    "bleach",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
