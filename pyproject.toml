[project]
name = "ai-reader-2"
version = "0.1.0"
description = "Self-hosted EPUB reader with AI-assisted annotation, built on epubx"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "epub-extended>=0.2.1",
    "fastapi>=0.121.2",
    "uvicorn>=0.38.0",
    "jinja2>=3.1.6",
    "httpx>=0.27.0",
    "python-multipart>=0.0.6",
    "pypinyin>=0.54.0",
    "markdown-it-py",
    "bleach",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Starlette's TestClient prefers httpx2 and warns when only httpx is present
    # (starlette/testclient.py). The application itself imports httpx, so this is
    # a test-client need — it sat in `dependencies` and made production installs
    # carry a package they never import (REVIEW P3-8). `uv sync` installs the dev
    # group by default, so development and CI still get it.
    "httpx2>=2.0",
    # T1's browser smoke (tests/test_browser.py). The Python package is only half
    # of it: the test also needs a browser — `uv run playwright install chromium`
    # — and skips cleanly without one.
    "playwright>=1.64.1",
]
